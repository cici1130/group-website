<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask Safely</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Patrick+Hand&display=swap');
:root{--bg:#100b25;--panel:#201944;--ink:#e8e3ff;--blue:#c2b2ff;--red:#c4b7ff;--line:#3a2d70}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100b25}
body{color:var(--ink);font-family:Arial,'Patrick Hand',sans-serif;background:#100b25}
button,input,textarea,select{font:inherit}a{cursor:pointer;text-decoration:none;color:inherit}
.page{width:min(1200px,calc(100vw - 60px));min-height:calc(100vh - 38px);margin:19px auto;padding:34px 55px 55px;background:linear-gradient(145deg,#100b25,#171033);position:relative;border:1px solid #30245d;border-radius:18px}
.brand{font-family:'Caveat','Comic Sans MS',cursive;font-size:68px;font-weight:700;line-height:.9;letter-spacing:-2px}.role{color:var(--red);font-size:30px;text-decoration:underline;text-underline-offset:5px;margin-top:9px}
.logout{position:absolute;right:40px;top:25px;color:var(--blue);border:2px solid var(--blue);padding:3px 13px;background:transparent;font-size:22px;z-index:3}
.nav{display:flex;gap:48px;margin-top:24px;margin-bottom:22px}.nav a{font-size:27px;border-bottom:2px solid #3a2d70;padding:0 2px 3px}.nav a.active{border-bottom:6px solid #a894ff}
.heading{font-size:27px;font-weight:600;margin:18px 0 6px}.under{text-decoration:underline;text-underline-offset:3px}.hand-blue,.todo-sub,.task-count,.empty,.due,.blue{color:var(--blue)}
.outline-btn{display:inline-block;color:var(--blue);background:transparent;border:2px solid var(--blue);font-size:23px;padding:4px 14px;line-height:1.05;cursor:pointer}.outline-btn:hover{background:rgba(194,178,255,.10)}
.todo-title{font-size:28px;margin-top:22px}.todo-sub{font-size:23px;margin-top:-4px}.section{margin-top:25px}
.request-form{width:700px;max-width:78%}.field{margin:17px 0}label{display:block;font-size:25px;margin-bottom:4px}
input,textarea,select{width:100%;background:#17112f;border:1.7px solid var(--line);padding:6px 10px;color:var(--blue);font-size:23px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue)}textarea{height:140px;resize:vertical}select{height:42px}
.check{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:23px;margin:18px 0 12px}.check input{width:20px;height:20px}
.profile-form{width:560px;max-width:75%}.profile-form input{height:43px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin:10px 0 27px}.metric{border:1.8px solid #3a2d70;padding:10px 18px;min-height:74px;font-size:24px;line-height:1.05}.metric .n{display:block;color:var(--blue);font-size:30px}
table{border-collapse:collapse;width:900px;max-width:100%;font-size:22px}th,td{text-align:left;padding:6px 14px 5px 0;font-weight:400}th{font-size:23px}
.survey-list{margin-top:16px;width:1000px;max-width:92%}.survey-item{display:flex;align-items:center;gap:28px;font-size:24px;padding:5px 0 13px;flex-wrap:wrap}.survey-item .name{min-width:390px}.survey-actions{display:flex;gap:12px;flex-wrap:wrap}
.login-page{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 38px)}.login-inner{width:800px}.login-inner .brand{font-size:78px;text-align:center;margin-bottom:55px}.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px}.login-role{color:var(--red);font-size:31px;text-decoration:underline;margin-bottom:18px}
.auth-page{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 38px)}.auth-inner{width:500px;max-width:100%}.auth-inner .brand{text-align:center;font-size:76px;margin-bottom:18px}.auth-title{text-align:center;color:var(--red);font-size:30px;text-decoration:underline;margin-bottom:28px}.auth-links{display:flex;gap:24px;flex-wrap:wrap;margin-top:15px}.auth-note{color:var(--blue);font-size:19px;margin-top:12px}.right-btn{position:absolute;right:40px;top:88px}.page-actions{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 25px}
.card{border:1.8px solid #3a2d70;padding:14px 18px;margin:15px 0;max-width:900px}.card-title{font-size:25px}.card-sub{font-size:21px;color:var(--blue)}.reply-box{margin-top:12px}.small-btn{font-size:20px;padding:3px 12px}.status{color:var(--blue);font-size:20px}
.demo-preview{border:2px dashed #6c58b3;padding:20px;margin-top:18px;max-width:900px}.demo-preview h3{font-size:27px;margin:0 0 8px}.demo-preview p{font-size:21px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px;max-width:900px}.result-box{border:1.8px solid #3a2d70;padding:15px;font-size:21px}.result-box .big{font-size:32px;color:var(--blue)}
.auth-back{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.backspace-row{display:flex;gap:8px;align-items:center}.backspace-row input{flex:1;min-width:0}.backspace-btn{color:var(--blue);border:1px solid var(--line);background:var(--panel);padding:6px 12px;font-size:20px;cursor:pointer}.history{font-size:18px;color:#c2b2ff;border-left:3px solid #6c58b3;padding:7px 12px;margin:8px 0}.toast{position:fixed;right:22px;bottom:22px;background:#201944;border:2px solid var(--blue);color:var(--ink);padding:10px 17px;font-size:20px;display:none;z-index:20}
@media(max-width:800px){.page{width:calc(100vw - 20px);padding:25px}.brand{font-size:54px}.role{font-size:25px}.nav{gap:22px;overflow:auto}.nav a{font-size:23px;white-space:nowrap}.metrics,.login-grid,.result-grid{grid-template-columns:1fr}.request-form,.profile-form,.survey-list{max-width:100%;width:100%}.survey-item{display:block}.survey-item .name{min-width:0;margin-bottom:8px}.logout{right:18px;top:18px}.right-btn{right:25px;top:92px}.login-inner .brand,.auth-inner .brand{font-size:60px}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const KEY='ask-safely-v3';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 role:null,loginRole:null,requests:[],
 surveys:[{name:'Teaching experience check-in',due:'15 Oct 2026',days:'in 7 days',question:'How has your teaching experience been?',completed:false,responses:0,respondents:[],result:'No responses yet'}]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function go(p){location.hash=p}
function chooseLogin(r){state.loginRole=r;save();go('login/'+r)}
function login(r){state.role=r;state.loginRole=null;save();go(r==='teaching'?'teaching/dashboard':'first/dashboard')}
function logout(){state.role=null;state.loginRole=null;save();go('login')}
function shell(role,active,body,action=''){let label=role==='teaching'?'Teaching staff':'First Nations staff',links=role==='teaching'?[['dashboard','Dashboard'],['request','Request help'],['profile','Profile']]:[['dashboard','Dashboard'],['surveys','Surveys'],['profile','Profile']];return `<main class="page"><div class="brand">Ask Safely</div><div class="role">${label}</div><a class="logout" href="#login" onclick="logout()">Log out</a><nav class="nav">${links.map(x=>`<a class="${active===x[0]?'active':''}" href="#${role}/${x[0]}">${x[1]}</a>`).join('')}</nav>${action}<div>${body}</div></main>`}
function loginPage(){return `<main class="page login-page"><div class="login-inner"><div class="brand">Ask Safely</div><div class="login-grid"><div><div class="login-role">Teaching staff</div><a class="outline-btn" href="#login/teaching" onclick="chooseLogin('teaching')">Log in</a></div><div><div class="login-role">First Nations staff</div><a class="outline-btn" href="#login/first" onclick="chooseLogin('first')">Log in</a></div></div></div></main>`}
function authPage(r){let label=r==='teaching'?'Teaching staff':'First Nations staff';return `<main class="page auth-page"><div class="auth-inner"><div class="brand">Ask Safely</div><div class="auth-title">${label} login</div><div class="field"><label>Username</label><div class="backspace-row"><input id="username" autocomplete="username"><button type="button" class="backspace-btn" onclick="backspaceField('username')" aria-label="Delete last character">⌫</button></div></div><div class="field"><label>Password</label><div class="backspace-row"><input id="password" type="password" autocomplete="current-password"><button type="button" class="backspace-btn" onclick="backspaceField('password')" aria-label="Delete last character">⌫</button></div></div><button class="outline-btn" onclick="doLogin('${r}')">Log in</button><div class="auth-links"><a class="outline-btn small-btn" href="#forgot/${r}">Forgot password?</a><a class="outline-btn small-btn" href="#new-user/${r}">New user</a></div><div class="auth-note">Demo: any non-empty username and password will work.</div><div class="auth-back"><a class="outline-btn small-btn" href="#login" onclick="logout()">Log out / Change role</a></div></div></main>`}
function forgotPage(r){let label=r==='teaching'?'Teaching staff':'First Nations staff';return `<main class="page auth-page"><div class="auth-inner"><div class="brand">Ask Safely</div><div class="auth-title">Forgot password</div><p style="font-size:22px">Enter your ${label.toLowerCase()} email and we will send a password reset link.</p><div class="field"><label>Email</label><input id="resetEmail" type="email"></div><button class="outline-btn" onclick="sendReset()">Send reset link</button><div style="margin-top:15px"><a class="outline-btn small-btn" href="#login/${r}">Back to login</a><a class="outline-btn small-btn" href="#login" onclick="logout()">Log out / Change role</a></div></div></main>`}
function newUserPage(r){let label=r==='teaching'?'Teaching staff':'First Nations staff';return `<main class="page auth-page"><div class="auth-inner"><div class="brand">Ask Safely</div><div class="auth-title">New user</div><div class="field"><label>Full name</label><input id="newName"></div><div class="field"><label>University email</label><input id="newEmail" type="email"></div><div class="field"><label>Create password</label><input id="newPassword" type="password"></div><button class="outline-btn" onclick="createUser('${r}')">Create account</button><div style="margin-top:15px"><a class="outline-btn small-btn" href="#login/${r}">Back to login</a><a class="outline-btn small-btn" href="#login" onclick="logout()">Log out / Change role</a></div></div></main>`}
function backspaceField(id){let e=document.getElementById(id);if(!e)return;e.value=e.value.slice(0,-1);e.focus()}
function doLogin(r){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim();if(!u||!p){toast('Please enter username and password');return}login(r)}
function sendReset(){let e=document.getElementById('resetEmail').value.trim();if(!e)return toast('Please enter your email');toast('Password reset link sent');setTimeout(()=>go('login/'+(state.loginRole||'teaching')),500)}
function createUser(r){let n=document.getElementById('newName').value.trim(),e=document.getElementById('newEmail').value.trim(),p=document.getElementById('newPassword').value.trim();if(!n||!e||!p)return toast('Please complete all fields');toast('Account created');setTimeout(()=>go('login/'+r),500)}
function teachingDash(){let tasks=state.surveys.map((s,i)=>`<div class="todo-title">${esc(s.name)}</div><div class="todo-sub">Survey from the First Nations team | Due ${esc(s.due)} (${esc(s.days||'upcoming')})</div><div style="margin-top:8px">${s.completed?'<span class="status">Completed</span>':'<a class="outline-btn" href="#teaching/survey/'+i+'">Take survey</a>'}</div>`).join('');return shell('teaching','dashboard',`<div class="heading under">To do</div>${tasks||'<div class="empty">No surveys assigned right now.</div>'}<div class="section"><div class="heading under">Tasks completed</div><div class="task-count">${state.surveys.filter(s=>s.completed).length} survey(s) completed</div></div><div class="section"><div class="heading under">My requests</div><div class="empty">${state.requests.length?state.requests.length+' request(s) submitted.':'No request yet. Use Request help to ask a question.'}</div>${state.requests.filter(r=>r.reply).map(r=>`<div class="card"><div class="card-title">${esc(r.subject)}</div><div class="card-sub">Reply from First Nations staff</div><p>${esc(r.reply)}</p></div>`).join('')}</div>`)}
function requestPage(){return shell('teaching','request',`<div class="request-form"><div class="field"><label>Send to</label><select id="sendTo"><option>Anyone on the team</option><option>First Nations education team 1</option><option>First Nations education team 2</option></select></div><div class="field"><label>Subject</label><input id="subject"></div><div class="field"><label>Your Question</label><textarea id="question"></textarea></div><label class="check"><input id="anon" type="checkbox"> Send anonymously</label><button class="outline-btn" onclick="sendRequest()">Send request</button></div>`)}
function teachingProfile(){return shell('teaching','profile',`<div class="profile-form"><div class="field"><label>Name</label><input value="xyz"></div><div class="field"><label>Role</label><input value="Teaching staff"></div><div class="field"><label>Subjects</label><input value="Computer Science, Data Science"></div><div class="field"><label>Campus</label><input value="Main campus"></div></div>`)}
function firstDash(){return shell('first','dashboard',`<div class="metrics"><div class="metric"><span class="n">${state.surveys.length}</span>surveys published</div><div class="metric"><span class="n">${state.surveys.reduce((a,s)=>a+(s.responses||0),0)}</span>responses received</div><div class="metric"><span class="n">${state.requests.filter(r=>!r.completed).length}</span>request(s) awaiting a reply</div></div><div class="heading">Teaching staff progress</div><table><thead><tr><th>Name</th><th>Tasks completed</th><th>Tasks outstanding</th><th>Named request</th></tr></thead><tbody><tr><td class="blue">Teacher A</td><td class="blue">0</td><td class="blue">1</td><td class="blue">0</td></tr><tr><td class="blue">Teacher B</td><td class="blue">1</td><td class="blue">0</td><td class="blue">1</td></tr><tr><td class="blue">Teacher C</td><td class="blue">0</td><td class="blue">1</td><td class="blue">0</td></tr></tbody></table><div class="heading" style="margin-top:28px">Requests</div>${state.requests.length?state.requests.map((r,i)=>`<div class="card"><div class="card-title">${esc(r.subject)}</div><div class="card-sub">To: ${esc(r.sendTo||'Anyone on the team')} ${r.anonymous?'| Anonymous':''}</div><p style="font-size:21px">${esc(r.question)}</p><div class="status">Status: ${r.completed?'Completed':'Awaiting reply'}</div><div class="reply-box"><label>Reply</label><textarea id="reply-${i}" placeholder="Write a reply to the teaching staff..."></textarea><button class="outline-btn small-btn" onclick="replyRequest(${i})">Send reply</button></div></div>`).join(''):'<div class="empty">No requests yet.</div>'}<div class="heading" style="margin-top:28px">Anonymous requests</div><div class="empty">Completed: ${state.requests.filter(r=>r.anonymous&&r.completed).length} | Awaiting reply: ${state.requests.filter(r=>r.anonymous&&!r.completed).length}</div>`)}
function surveys(){return shell('first','surveys',`<a class="outline-btn right-btn" href="#first/new-survey">New survey</a><div class="heading">Surveys</div><div class="survey-list">${state.surveys.map((s,i)=>`<div class="survey-item"><div class="name">${esc(s.name)}</div><div class="due">Due ${esc(s.due)} (${esc(s.days||'upcoming')})</div><div class="survey-actions"><a class="outline-btn" href="#first/edit/${i}">Edit</a><a class="outline-btn" href="#first/results/${i}">Responses & results</a></div></div>`).join('')}</div>`)}
function firstProfile(){return shell('first','profile',`<div class="profile-form"><div class="field"><label>Name</label><input value="xyz"></div><div class="field"><label>Role</label><input value="First Nations education team"></div></div>`)}
function surveyForm(i=null){let s=i===null?null:state.surveys[i];return shell('first','surveys',`<div class="request-form"><div class="field"><label>Survey name</label><input id="surveyName" value="${s?esc(s.name):''}"></div><div class="field"><label>Due date</label><input id="surveyDue" value="${s?esc(s.due):'22 Oct 2026'}"></div><div class="field"><label>Question</label><textarea id="surveyQuestion" placeholder="Write your survey question here...">${s&&s.question?esc(s.question):''}</textarea></div><div class="page-actions"><button class="outline-btn" onclick="saveSurvey(${i===null?'null':i})">${i===null?'Create survey':'Save changes'}</button><button class="outline-btn" onclick="previewSurveyDraft()">Demo: teaching staff view</button></div></div>`)}
function response(i=0){let s=state.surveys[i];if(!s)return teachingDash();return shell('teaching','dashboard',`<div class="heading under">${esc(s.name)}</div><div class="request-form"><div class="field"><label>${esc(s.question||'Your response')}</label><textarea id="response"></textarea></div><button class="outline-btn" onclick="submitSurvey(${i})">Submit survey</button><a class="outline-btn small-btn" href="#teaching/dashboard">Back to dashboard</a></div>`)}
function surveyResults(i){let s=state.surveys[i];return shell('first','surveys',`<div class="heading under">${esc(s.name)} — Responses & results</div><div class="result-grid"><div class="result-box"><div class="big">${s.responses||0}</div>Responses received</div><div class="result-box"><div class="big">${s.completed?'Completed':'Awaiting response'}</div>Teaching staff status</div></div><div class="heading" style="margin-top:28px">Results</div><div class="result-box" style="max-width:900px"><strong>Who completed it</strong><div style="margin-top:8px">${(s.respondents&&s.respondents.length)?s.respondents.map(x=>`<div class="blue">${esc(x)} — Completed</div>`).join(''):'No completed responses yet.'}</div><div style="margin-top:14px"><strong>Outcome</strong><div style="margin-top:8px">${esc(s.result||'No responses yet')}</div></div></div><div class="heading" style="margin-top:24px">Survey edit history</div><div class="result-box" style="max-width:900px">${(s.history&&s.history.length)?s.history.slice().reverse().map(h=>`<div class="history"><strong>${esc(h.when)}</strong><br>${esc(h.summary)}</div>`).join(''):'No edits recorded yet.'}</div><div style="margin-top:16px"><a class="outline-btn" href="#first/surveys">Back to surveys</a></div>`)}
function previewSurveyDraft(){let n=document.getElementById('surveyName').value.trim()||'Untitled survey',q=document.getElementById('surveyQuestion').value.trim()||'Survey question';document.getElementById('root').innerHTML=shell('first','surveys',`<div class="heading under">Survey demo — Teaching staff perspective</div><div class="demo-preview"><h3>${esc(n)}</h3><p>${esc(q)}</p><textarea placeholder="Teaching staff would answer here..."></textarea><div style="margin-top:12px"><button class="outline-btn" onclick="toast('Demo only — response not submitted')">Submit demo response</button></div></div><div style="margin-top:16px"><button class="outline-btn" onclick="go('first/new-survey')">Back to new survey</button></div>`)}
function surveyDemo(i){let s=state.surveys[i];return shell('first','surveys',`<div class="heading under">Survey demo — Teaching staff perspective</div><div class="demo-preview"><h3>${esc(s.name)}</h3><p>${esc(s.question||'How has your teaching experience been?')}</p><textarea placeholder="Teaching staff would answer here..."></textarea><div style="margin-top:12px"><button class="outline-btn" onclick="toast('Demo only — response not submitted')">Submit demo response</button></div></div><div style="margin-top:16px"><a class="outline-btn" href="#first/edit/${i}">Back to edit</a></div>`)}
function sendRequest(){let subject=document.getElementById('subject').value.trim(),question=document.getElementById('question').value.trim(),sendTo=document.getElementById('sendTo').value;if(!subject||!question)return toast('Please enter a subject and question');state.requests.push({subject,question,sendTo,anonymous:document.getElementById('anon').checked,completed:false,reply:''});save();toast('Request sent safely');go('teaching/dashboard')}
function replyRequest(i){let t=document.getElementById('reply-'+i).value.trim();if(!t)return toast('Please write a reply');state.requests[i].reply=t;state.requests[i].completed=true;save();toast('Reply sent');go('first/dashboard')}
function submitSurvey(i=0){let s=state.surveys[i];if(!s)return;if(s.completed)return toast('This survey has already been completed');let answer=document.getElementById('response').value.trim();if(!answer)return toast('Please enter your response');s.completed=true;s.responses=(s.responses||0)+1;s.respondents=s.respondents||[];if(!s.respondents.includes('Teacher A'))s.respondents.push('Teacher A');s.result='Response received from teaching staff';s.answer=answer;save();toast('Survey submitted');go('teaching/dashboard')}
function saveSurvey(i){let n=document.getElementById('surveyName').value.trim(),d=document.getElementById('surveyDue').value.trim(),q=document.getElementById('surveyQuestion').value.trim();if(!n||!d||!q)return toast('Please complete the fields');let now=new Date().toLocaleString();if(i===null){state.surveys.push({name:n,due:d,days:'upcoming',question:q,responses:0,respondents:[],result:'No responses yet',completed:false,history:[{when:now,summary:'Survey created.'}]})}else{let s=state.surveys[i];s.history=s.history||[];let changes=[];if(s.name!==n)changes.push('Name changed');if(s.due!==d)changes.push('Due date changed');if(s.question!==q)changes.push('Question changed');if(changes.length)s.history.push({when:now,summary:changes.join(', ')+'.'});s.name=n;s.due=d;s.question=q}save();toast('Survey saved');go('first/surveys')}
function render(){let p=location.hash.replace(/^#/,'')||'login';let h;if(p==='login')h=loginPage();else if(p.startsWith('login/'))h=authPage(p.split('/')[1]);else if(p.startsWith('forgot/'))h=forgotPage(p.split('/')[1]);else if(p.startsWith('new-user/'))h=newUserPage(p.split('/')[1]);else if(!state.role)h=loginPage();else h=p==='teaching/dashboard'?teachingDash():p==='teaching/request'?requestPage():p==='teaching/profile'?teachingProfile():p==='teaching/survey'?response(0):p.startsWith('teaching/survey/')?response(+p.split('/').pop()):p==='first/dashboard'?firstDash():p==='first/surveys'?surveys():p==='first/profile'?firstProfile():p==='first/new-survey'?surveyForm():p.startsWith('first/edit/')?surveyForm(+p.split('/').pop()):p.startsWith('first/results/')?surveyResults(+p.split('/').pop()):p.startsWith('first/demo/')?surveyDemo(+p.split('/').pop()):loginPage();document.getElementById('root').innerHTML=h}
addEventListener('hashchange',render);render();
</script>
</body></html>
