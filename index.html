<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Safely</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Patrick+Hand&display=swap');
:root{--bg:#d7f2f3;--ink:#34373a;--blue:#273d96;--red:#76545c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}body{color:var(--ink);font-family:'Patrick Hand','Comic Sans MS',cursive;background:linear-gradient(135deg,#d9f2f3,#c9ecee)}button,input,textarea,select{font:inherit}a{cursor:pointer;text-decoration:none;color:inherit}.page{width:min(1200px,calc(100vw - 60px));min-height:calc(100vh - 38px);margin:19px auto;padding:34px 55px 55px;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.15),transparent 25%),linear-gradient(135deg,#d7f2f3,#c9ecee);position:relative}.brand{font-family:'Caveat','Comic Sans MS',cursive;font-size:68px;font-weight:700;line-height:.9;letter-spacing:-2px}.role{color:var(--red);font-size:30px;text-decoration:underline;text-underline-offset:5px;margin-top:9px}.logout{position:absolute;right:40px;top:25px;color:var(--blue);border:2px solid var(--blue);padding:3px 13px;background:transparent;font-size:22px}.nav{display:flex;gap:48px;margin-top:24px;margin-bottom:22px}.nav a{font-size:27px;border-bottom:2px solid #5c666b;padding:0 2px 3px}.nav a.active{border-bottom:7px solid #4c565c}.heading{font-size:27px;font-weight:600;margin:18px 0 6px}.under{text-decoration:underline;text-underline-offset:3px}.hand-blue,.todo-sub,.task-count,.empty,.due{color:var(--blue)}.outline-btn{display:inline-block;color:var(--blue);background:transparent;border:2px solid var(--blue);font-size:23px;padding:4px 14px;line-height:1.05}.right-btn{position:absolute;right:10px;top:5px}.todo-title{font-size:28px;margin-top:22px}.todo-sub{font-size:23px;margin-top:-4px}.section{margin-top:25px}.request-form{width:620px;max-width:70%}.field{margin:17px 0}label{display:block;font-size:25px;margin-bottom:4px}input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1.7px solid #667177;padding:6px 10px;color:var(--blue);font-size:23px;outline:none}textarea{height:140px;resize:vertical}select{height:42px}.check{display:flex;align-items:center;gap:8px;color:var(--blue);font-size:23px;margin:18px 0 12px}.check input{width:20px;height:20px}.profile-form{width:430px;max-width:65%}.profile-form input{height:43px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin:10px 0 27px}.metric{border:1.8px solid #5c686d;padding:10px 18px;min-height:74px;font-size:24px;line-height:1.05}.metric .n{display:block;color:var(--blue);font-size:30px}table{border-collapse:collapse;width:850px;max-width:100%;font-size:22px}th,td{text-align:left;padding:6px 14px 5px 0;font-weight:400}th{font-size:23px}.blue{color:var(--blue)}.survey-list{margin-top:16px;width:900px;max-width:85%}.survey-item{display:flex;align-items:center;gap:28px;font-size:24px;padding:5px 0 13px}.survey-item .name{min-width:390px}.login-page{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 38px)}.login-inner{width:800px}.login-inner .brand{font-size:78px;text-align:center;margin-bottom:55px}.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px}.login-role{color:var(--red);font-size:31px;text-decoration:underline;margin-bottom:18px}.toast{position:fixed;right:22px;bottom:22px;background:#e8f8f8;border:2px solid var(--blue);color:var(--blue);padding:10px 17px;font-size:20px;display:none}@media(max-width:800px){.page{width:calc(100vw - 20px);padding:25px}.brand{font-size:54px}.role{font-size:25px}.nav{gap:22px;overflow:auto}.nav a{font-size:23px;white-space:nowrap}.metrics,.login-grid{grid-template-columns:1fr}.request-form,.profile-form,.survey-list{max-width:100%;width:100%}.survey-item{display:block}.survey-item .name{min-width:0}.logout{right:18px;top:18px}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const KEY='ask-safely-v2';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{role:null,requests:[],surveys:[{name:'Teaching experience check-in',due:'15 Oct 2026',days:'in 7 days',completed:false}]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function go(p){location.hash=p}function login(r){state.role=r;save();go(r==='teaching'?'teaching/dashboard':'first/dashboard')}function logout(){state.role=null;save();go('login')}
function shell(role,active,body){let label=role==='teaching'?'Teaching staff':'First Nations staff',links=role==='teaching'?[['dashboard','Dashboard'],['request','Request help'],['profile','Profile']]:[['dashboard','Dashboard'],['surveys','Surveys'],['profile','Profile']];return `<main class="page"><div class="brand">Ask Safely</div><div class="role">${label}</div><a class="logout" href="#login" onclick="logout()">Log out</a><nav class="nav">${links.map(x=>`<a class="${active===x[0]?'active':''}" href="#${role}/${x[0]}">${x[1]}</a>`).join('')}</nav><div>${body}</div></main>`}
function loginPage(){return `<main class="page login-page"><div class="login-inner"><div class="brand">Ask Safely</div><div class="login-grid"><div><div class="login-role">Teaching staff</div><a class="outline-btn" href="#teaching/dashboard" onclick="login('teaching')">Log in</a></div><div><div class="login-role">First Nations staff</div><a class="outline-btn" href="#first/dashboard" onclick="login('first')">Log in</a></div></div></div></main>`}
function teachingDash(){let s=state.surveys[0];return shell('teaching','dashboard',`<div class="heading under">To do</div><a class="outline-btn right-btn" href="#teaching/survey">Take survey</a><div class="todo-title">Teaching experience check-in</div><div class="todo-sub">Survey from the First Nations team | Due ${s.due} (${s.days})</div><div class="section"><div class="heading under">Tasks completed</div><div class="task-count">${s.completed?'1':'0'} survey(s) completed</div></div><div class="section"><div class="heading under">My requests</div><div class="empty">${state.requests.length?'Request submitted.':'No request yet. Use Request help to ask a question.'}</div></div>`)}
function requestPage(){return shell('teaching','request',`<div class="request-form"><div class="field"><label>Send to</label><select id="sendTo"><option>Anyone on the team</option><option>First Nations education team</option></select></div><div class="field"><label>Subject</label><input id="subject"></div><div class="field"><label>Your Question</label><textarea id="question"></textarea></div><label class="check"><input id="anon" type="checkbox"> Send anonymously</label><button class="outline-btn" onclick="sendRequest()">Send request</button></div>`)}
function teachingProfile(){return shell('teaching','profile',`<div class="profile-form"><div class="field"><label>Name</label><input value="xyz"></div><div class="field"><label>Campus</label><input value="Main campus"></div></div>`)}
function firstDash(){return shell('first','dashboard',`<div class="metrics"><div class="metric"><span class="n">1</span>surveys published</div><div class="metric"><span class="n">${state.surveys.filter(x=>x.completed).length}</span>responses received</div><div class="metric"><span class="n">1</span>request pending</div></div><div class="heading">Teaching staff progress</div><table><thead><tr><th>Name</th><th>Tasks completed</th><th>Tasks pending</th><th>Named request</th></tr></thead><tbody><tr><td class="blue">Teacher A</td><td class="blue">0</td><td class="blue">1</td><td class="blue">0</td></tr><tr><td class="blue">Teacher B</td><td class="blue">1</td><td class="blue">0</td><td class="blue">1</td></tr><tr><td class="blue">Teacher C</td><td class="blue">0</td><td class="blue">1</td><td class="blue">0</td></tr></tbody></table><div class="heading" style="margin-top:28px">Anonymous requests</div><div class="empty">Completed: 0 | Pending: 0</div>`)}
function surveys(){return shell('first','surveys',`<a class="outline-btn right-btn" href="#first/new-survey">New survey</a><div class="heading">Surveys</div><div class="survey-list">${state.surveys.map((s,i)=>`<div class="survey-item"><div class="name">${esc(s.name)}</div><div class="due">Due ${s.due} (${s.days})</div><a class="outline-btn" href="#first/edit/${i}">Edit</a></div>`).join('')}</div>`)}
function firstProfile(){return shell('first','profile',`<div class="profile-form"><div class="field"><label>Name</label><input value="xyz"></div><div class="field"><label>Role</label><input value="First Nations education team"></div></div>`)}
function surveyForm(i=null){let s=i===null?null:state.surveys[i];return shell('first','surveys',`<div class="request-form"><div class="field"><label>Survey name</label><input id="surveyName" value="${s?esc(s.name):''}"></div><div class="field"><label>Due date</label><input id="surveyDue" value="${s?esc(s.due):'22 Oct 2026'}"></div><button class="outline-btn" onclick="saveSurvey(${i===null?'null':i})">${i===null?'Create survey':'Save changes'}</button></div>`)}
function response(){return shell('teaching','dashboard',`<div class="heading under">Teaching experience check-in</div><div class="request-form"><div class="field"><label>How has your teaching experience been?</label><textarea id="response"></textarea></div><button class="outline-btn" onclick="submitSurvey()">Submit survey</button></div>`)}
function sendRequest(){let subject=document.getElementById('subject').value.trim(),question=document.getElementById('question').value.trim();if(!subject||!question)return toast('Please enter a subject and question');state.requests.push({subject,question,anonymous:document.getElementById('anon').checked});save();toast('Request sent safely');go('teaching/dashboard')}function submitSurvey(){state.surveys[0].completed=true;save();toast('Survey submitted');go('teaching/dashboard')}function saveSurvey(i){let n=document.getElementById('surveyName').value.trim(),d=document.getElementById('surveyDue').value.trim();if(!n||!d)return toast('Please complete the fields');if(i===null)state.surveys.push({name:n,due:d,days:'upcoming',completed:false});else{state.surveys[i].name=n;state.surveys[i].due=d}save();toast('Survey saved');go('first/surveys')}
function render(){let p=location.hash.replace(/^#/,'')||'login';if(p==='login'||!state.role)return document.getElementById('root').innerHTML=loginPage();let h=p==='teaching/dashboard'?teachingDash():p==='teaching/request'?requestPage():p==='teaching/profile'?teachingProfile():p==='teaching/survey'?response():p==='first/dashboard'?firstDash():p==='first/surveys'?surveys():p==='first/profile'?firstProfile():p==='first/new-survey'?surveyForm():p.startsWith('first/edit/')?surveyForm(+p.split('/').pop()):loginPage();document.getElementById('root').innerHTML=h}addEventListener('hashchange',render);render();
</script></body></html>
